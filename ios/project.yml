name: BG_Sensing

options:
  bundleIdPrefix: com.brugerard
  deploymentTarget:
    iOS: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"    # iPhone only
    CODE_SIGN_STYLE: Automatic

targets:
  BG_Sensing:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: BG_Sensing
        excludes:
          - Info.plist
          - "**/.gitkeep"
    info:
      path: BG_Sensing/Info.plist
    settings:
      base:
        PRODUCT_NAME: BG_Sensing
        PRODUCT_BUNDLE_IDENTIFIER: com.brugerard.bgsensing
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets: []
      gatherCoverageData: false
