name: PhoneSensors

options:
  bundleIdPrefix: com.brugerard
  deploymentTarget:
    iOS: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"    # iPhone only
    CODE_SIGN_STYLE: Automatic

targets:
  PhoneSensors:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: PhoneSensors
        excludes:
          - Info.plist
          - "**/.gitkeep"
    info:
      path: PhoneSensors/Info.plist
    settings:
      base:
        PRODUCT_NAME: PhoneSensors
        PRODUCT_BUNDLE_IDENTIFIER: com.brugerard.phonesensors
    scheme:
      testTargets: []
      gatherCoverageData: false
