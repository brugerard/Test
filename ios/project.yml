name: BG_Sensing

options:
  bundleIdPrefix: com.brugerard
  deploymentTarget:
    iOS: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"    # iPhone only
    CODE_SIGN_STYLE: Automatic

targets:
  BG_Sensing:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: BG_Sensing
        excludes:
          - "**/.gitkeep"
    settings:
      base:
        PRODUCT_NAME: BG_Sensing
        PRODUCT_BUNDLE_IDENTIFIER: com.brugerard.bgsensing
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"

    # Info.plist: XcodeGen generates and wires up the plist file itself from
    # this `properties` dict (GENERATE_INFOPLIST_FILE is set to NO
    # automatically). This is the third mechanism this project has tried:
    #   1. An explicit physical Info.plist file wired via `info.path` —
    #      silently failed to carry NSCameraUsageDescription into the build
    #      (a path-resolution issue with an externally-authored file).
    #   2. GENERATE_INFOPLIST_FILE + individual INFOPLIST_KEY_* build
    #      settings — worked for NSCameraUsageDescription/UILaunchScreen_
    #      Generation/UISupportedInterfaceOrientations, but
    #      UIFileSharingEnabled/LSSupportsOpeningDocumentsInPlace silently
    #      didn't take even after a clean rebuild + reinstall.
    #   3. This: XcodeGen's own `info.properties`, which it generates and
    #      references itself rather than us pointing at a path or hoping a
    #      given key is on some INFOPLIST_KEY_ shortlist. All Info.plist
    #      keys now live in exactly one place, below.
    info:
      # Where XcodeGen writes the plist it generates from `properties` below.
      # Deliberately outside `BG_Sensing/` (the `sources:` scanned folder above)
      # so the generated file is never picked up a second time as a resource.
      # XcodeGen's schema treats `path` as required even when `properties` is
      # supplied — omitting it caused `Decoding failed at "path": Nothing found`
      # even on a recent XcodeGen (2.46.0), which ruled out a version issue.
      path: Info.plist
      properties:
        CFBundleDevelopmentRegion: en
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: APPL
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: "This app uses the camera together with ARKit to record RGB imagery and LiDAR depth for scientific data collection."
        NSMotionUsageDescription: "This app uses device motion sensors (attitude, acceleration, gyroscope, magnetometer) for scientific data collection during recording sessions."
        NSLocationWhenInUseUsageDescription: "This app records GPS location, altitude, and compass heading alongside camera/LiDAR data for scientific data collection during recording sessions."
        # Makes recorded sessions (in the app's Documents/Sessions folder)
        # browsable from a Mac via Finder (device > BG_Sensing) and from the
        # Files app on the phone, without needing the Phase 7 export/share
        # flow.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    scheme:
      testTargets: []
      gatherCoverageData: false
